{% extends "base.html" %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<div class="card shadow-sm mt-4">
    <div class="card-body text-center p-5">
        <h3 class="mb-4">Вы уверены, что хотите удалить этот объект?</h3>
        <p class="text-muted">Это действие нельзя будет отменить.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg">Да, удалить</button>
            <a href="javascript:history.back()" class="btn btn-secondary btn-lg">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
