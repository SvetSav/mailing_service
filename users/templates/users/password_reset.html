{% extends "base.html" %}
{% block title %}Сброс пароля{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white text-center py-3"><h4 class="mb-0">Сброс пароля</h4></div>
            <div class="card-body p-4">
                <p class="text-muted text-center mb-4">Введите ваш email, и мы отправим ссылку для восстановления пароля.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Отправить письмо</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
