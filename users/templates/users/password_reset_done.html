{% extends "base.html" %}
{% block title %}Письмо отправлено{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="alert alert-success p-5">
            <h4>Письмо отправлено!</h4>
            <p>Мы отправили инструкцию по восстановлению пароля на указанный email. Проверьте консоль (если у вас настроен `console.EmailBackend`).</p>
            <a href="{% url 'users:login' %}" class="btn btn-outline-success mt-3">Вернуться ко входу</a>
        </div>
    </div>
</div>
{% endblock %}
