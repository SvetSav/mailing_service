{% extends "base.html" %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white text-center py-3"><h4 class="mb-0">Придумайте новый пароль</h4></div>
            <div class="card-body p-4">
                {% if validlink %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100">Сохранить пароль</button>
                    </form>
                {% else %}
                    <div class="alert alert-danger">
                        Ссылка для восстановления пароля недействительна или уже была использована.
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
