<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Рассылки{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'mailings:home' %}">Сервис рассылок</a>
        {% if user.is_authenticated %}
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'clients:list' %}">Получатели</a>
            <a class="nav-link" href="{% url 'mailings:message_list' %}">Сообщения</a>
            <a class="nav-link" href="{% url 'mailings:mailing_list' %}">Рассылки</a>
        </div>
        <div class="ms-auto text-light">
            {{ user.email }} |
            <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                {% csrf_token %}
                <button class="btn btn-sm btn-outline-light" type="submit">Выйти</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>

<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
